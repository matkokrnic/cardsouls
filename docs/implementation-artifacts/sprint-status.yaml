  3-1-matchstate-config-object: "DONE 2026-08-02 — dev pass 2.8 (Claude Opus 4.8) delivered all six ACs against the readiness-gate-fixed story: MatchParams replaces the five positional constructor floats (seed only, consumed into the RNG and never retained — never re-seeded is structural, E3-RG/R9); BalanceConfig is the single source of truth for max_hp/move_speed/max_stamina/max_mana, with the runner's four tunable constants deleted; the mana set authored 10.0 / 1.0 / 0.25 (3-1/R1, discharging BC/R2); the per-pool reload contract (stamina set_maximum + refill on every injection (D9), mana set_maximum only and never refilled, hp preserved and clamped, first injection detected as balance == null and filling hp via heal); the pre-injection stat-less contract with the new _check_resolution guard joining the balance_ticks == null gated family (3-1/R3/R4); test surface extended (E1_BALANCE_FIELDS, the authoring audit, three new tests in test_balance_config.gd, one new audit in test_balance_authoring.gd). Review passed in the browser session. Live smoke NOT REQUIRED per the gate's Q3 ruling — R-D6 does not attach (3-1 ships no player-facing code path) and remains AVAILABLE, last spent 3-0a/R15. Suite 188/874 -> 192/917 + 14 integration, golden unmoved (96ac5f64…). Close-out recorded in decision-log Session 2026-08-02 -- 3-1 close-out (rulings 3-1/R6-R9)."
  3-2-card-schemas-carddatabase: "DONE 2026-08-03 -- dev pass (Claude Opus 4.8) delivered all seven ACs against the readiness-gate-fixed story: three schemas (CardData, CardEffect, CardCastCondition) in src/state/resources/; nine fixture cards in data/cards/, one Spell/Minion/Totem per colour, the three totems covering the GDD's three totem subtypes; CardDatabase._load_all() replaced with a sorted, extension-filtered, single-directory scan indexed by the id field, plus a card_count() read accessor (AC4); the AC5 state-layer guard (test_state_layer_never_names_card_data, mutation-proven); the unblockable-negative guard (AC7). NO cast evaluator -- src/state/economy/economy_evaluator.gd carries a comment-only reciprocal cross-reference (AC4), no code; the evaluator lands with its first consumer in 3-5. Golden measured UNMOVED in both directions (98d0c7eb...) -- cards stay outside the hashed determinism run by construction (AC5), the deliberate asymmetry with data/economy/'s load-bearing rule content. Mutation table M1-M5 all confirmed. Suite 208/977 -> 218/1103 + a fifteenth integration file (test_card_database.gd). Review outcome and rulings recorded in the story's own Dev Pass Record; close-out recorded in decision-log."
  3-3-deck-hand-draw-reshuffle: "DONE 2026-08-03 -- dev pass (Claude Opus 4.8) delivered all twelve ACs against the readiness-gate-fixed story: pure Deck/Hand RefCounted classes under src/state/, owned by PlayerState (AC1); MatchState.inject_deck(), the deck-content injection seam on the inject_feature_flags precedent -- once at match start, content only, no reload path, with an Invariant.check rejecting an empty injected deck (AC2/AC10); CardDatabase.sorted_ids(), the one explicitly-sorted ordered accessor (AC3); the runner's provisional fixture composition, walking sorted ids up to each card's max_copies until deck_size is reached (AC4); StringName-only deck elements, counts-only PlayerState.to_snapshot() (AC5); deck_size/hand_size on BalanceConfig, audited > 0 and hand_size <= deck_size (AC6); an explicit in-place Fisher-Yates against the seeded RNG, one seat inside advance() step 6 serving both the match-start and debug-reset occasions (AC7); the extended architecture-invariants guard banning implicit-global-RNG collection APIs and the CardDatabase token under src/state/, mutation-proven (AC8); the hand fill to hand_size on both occasions (AC9); and the broad AC11 negative guard (no discard, reshuffle, exhaustion, vulnerable window, draw delay, EventBus signal, card effect, cast evaluator, UI, or Input Map surface). Golden re-baselined ONCE, three separately measured causes (snapshot shape; deck_size via RNG consumption; hand_size via the fill), both reverse toggles reproduced exactly: 98d0c7eb... -> ad42841e... (AC12). Suite 218/1103 + 15 integration -> 246/1186 + 16 integration (test_deck_injection.gd added, mutation-proven). Close-out recorded in decision-log."
