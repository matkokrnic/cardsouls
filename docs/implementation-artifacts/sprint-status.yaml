  3-0a-rig-adoption: "DONE 2026-07-31 (3-0a/R1-R16). Skinned paladin + six-clip AnimationPlayer in hero.tscn; DECISION A intact (root never rotates, test_root_rotation_isolation.gd AND test_visible_facing.gd both green); src/state/ byte-identical, golden 338172010a…21da2 unmoved both directions; suite 164/760/0, 10 integration files individually green (test_rig_clips.gd added, mutation-proven). Live smoke PASSED with two humans on the shipped default (R-D6 re-invoked, SPENT); three non-blocking findings handed to 3-0b (below)."
  3-0b-feel-and-timing-tuning: "DONE 2026-08-02 (3-0b/R1-R35 onward). Deterministic step/pause + per-slot debug window countdown (AC1/AC2); flat attack_move_speed_multiplier REMOVED, replaced by per-phase windup/active/recovery multipliers, plus a state-side additive attack lunge (AC5/AC6); attack clip 90->45 ticks and roll clip 142->30 ticks reconciled to their authored windows (AC3); the roll Hips excursion fully fixed — lateral (Hips XZ zeroed, Pass 3) and vertical (model grounded via Mesh.position.y = -1.0, telegraph anchors re-seated with it, Pass 3b) — closing all three 3-0a live-smoke findings; block's instant pop VERDICT KEEP (AC7, the 9-tick deflect window opens on the entry tick, a blend would misrepresent it); attack/block stings made audibly distinct on four orthogonal axes (AC9); pose_id explicitly RETIRED, no consumer (AC10); a pre-existing chain-retrigger defect fixed as a Pass 3b bycatch (three swings now reliably produce three animations, present since 3-0a, made legible by AC3's retime); AC8 feel/timing VERDICT NO CHANGE (Pass 3's retime already resolved the operator's original tempo observation; the 55.5% impact-peak offset is not visible in play, piecewise retime not built); AC11 definitive naive-observer legibility PASSED both runs, every trial correct, including the verdict that Pass 3b's accepted occlusion cost does not harm legibility; AC12 KEEP normalize_move_magnitude = true, now authored explicitly; AC13 collision box height left at 2.0. Golden re-baselined ONCE across the whole story (`7fbb4b7f…` -> `96ac5f64…`), both causes (AC5, AC6) isolated and named separately per the BC/R3 + SC/R6 discipline — AC5 a measured mover, AC6 a measured non-mover. Suite 188 state tests / 874 assertions / 0 failed, 14 integration files individually green (test_step_pause.gd, test_clip_timing.gd, test_vertical_alignment.gd, test_chain_retrigger.gd added across the four passes, mutation-proven). Live smoke: the two-human R-D6 smoke against the shipped default was NOT run this story — the Pass 4 playtest-log entry is a solo feel-judgment session, not a two-human match with both sides killable. R-D6 is NOT re-invoked; it stays AVAILABLE (last spent 3-0a/R15), carried to the next story that ships player-facing behaviour. Four named deferrals handed to a future tuning pass once the full gameplay loop exists, each with an owner: attack a touch too fast, roll a touch too slow, i-frames a touch too short, attack and roll should not share a stamina cost. Next inherits: a melee loop with all DEBT E members and the 3-0a live-smoke findings closed; the E3 card-system stories (3-0c onward) remain on HOLD pending their own readiness gates, unaffected by this close-out."
