  4-3-minion-approach-and-collision: "DONE 2026-08-10 -- all eight ACs shipped. Golden UNMOVED both directions at 73a86005, key set eleven; suite 445/3464 + 27 integration. Code review PASS (2 MEDIUM / 3 LOW, all five findings ruled 4-3/R21-R25, no blocking defects). project.godot and main.tscn byte-identical (no new layer, R-D6 NOT spent, 4-3/R14/R17). Live smoke PASS, operator's own hand, shipped defaults: a summoned unit approaches on summon; the hero cannot walk through or shove it; several units on one target show no jitter/wedging and track normally; authored 3.0/1.5 feel right. R-D6 unspent, stays available for 4-3a. All three layers (dev pass, code review, fix pass) completed with no stall (PROC/R6 counter stays 0). Close-out recorded in decision-log."
  4-3a-minion-damage-and-death: "DONE 2026-08-10 -- all eleven ACs shipped. Golden moved ONCE, 73a86005 -> 35c38c0e, with ONE measured cause (the unit hp snapshot key); key set eleven -> twelve. Suite 445/3464 + 27 integration -> 465/3621 + 29 integration. FORMAT_VERSION 2 -> 3, hard rejection of older records by design, no shim. project.godot and hero.tscn byte-identical. R-D6 NOT spent, stays available. Code review PASS with no blocking findings, both parallel layers completing -- the review-stall counter stays at zero. Live smoke PASS on the operator's own hand at shipped defaults. Close-out recorded in decision-log."
  4-3b-minion-attack-rhythm: "DONE 2026-08-12 -- all seventeen ACs shipped. Golden unmoved at re-measurement, 4a089063 (re-baselined once at the dev pass, 35c38c0e -> 4a089063, one measured cause: snapshot key set twelve -> eighteen). Suite 497/3878 + 30/30 integration, all PASS. FORMAT_VERSION 3 -> 4, hard rejection of older records, no shim. project.godot and hero.tscn byte-identical. Code review PASS (four non-blocking findings applied across two review-fix passes). Live smoke PASS on the operator's own hand, R-D6 spent -- his first hero death not caused by a hero; two smoke points (visual telegraph, evasion) recorded unmeasurable rather than failed. Melee retune (E3-R/R3) CUT to one balance edit (windup, optionally reach); rig/model debt named the binding constraint on enemy behaviour, owner assigned at E4 close-out. Five owner rulings recorded (review-layer untracked-file blindness, general harness-leak case, orphaned-process harness gap, six not-independently-derived ACs, hit_landed deferral reassigned). Close-out recorded in decision-log. UPDATE 2026-08-13: E3-R/R3 EXECUTED IN ITS CUT FORM, NOT FULLY DISCHARGED -- minion_attack_windup_seconds 0.5 -> 0.9 (30 -> 54 ticks), golden and suite unmoved both directions (497/3878, 4a089063...). The feel half (tempo, evasion, read) stays DEFERRED: the attack still has no visual telegraph, so it remains unmeasurable, not resolved. Recorded in decision-log Session 2026-08-13."
  4-3c-minion-rig-adoption: "DONE and pushed at 09ee13a. The post-smoke pass, the defect-B1 fix pass, and the code review fix pass all landed. Final measurements: suite 497/3878/0, integration 36 all PASS, golden 4a089063 UNMOVED. Two items carried out of 4-3c, not resolved here: 4-3c/R19 (units rooted during their own swing), now slotted as 4-3c1-swing-commitment; and the unrated end-of-swing truncation readability, carried to 4-3d."
  4-3c1-swing-commitment: "DONE 2026-08-17 -- chained per CFG/R2 (three readiness gates plus a final verification, dev pass, code review APPROVE, live smoke PASSED, golden unmoved). Implements 4-3c/R19: minions get their own three attack-phase move-speed multipliers, authored 0.0, not the hero's fields reused; no lunge for minions (explicit non-goal); full root matching the hero, via a pure unit_attack_phase_multiplier(phase) seat on match_state.gd read inline by the runner, IDLE returning 1.0 explicitly with no catch-all fall-through. CODE REVIEW APPROVE (record findings applied in a docs-only fix pass: Completion Note 6 rewritten, measurement table corrected to 499/3895, Completion Note (c) coordinates restated as measured-on-date, Live Smoke Results section added). LIVE SMOKE PASSED 2026-08-17 (docs/playtest-log.md, hand-written; strike/impact mismatch handed to 4-3d AC 1, not a 4-3c1 defect). Golden UNMOVED both directions (4a089063, no re-baseline). State harness 497/3878/0 -> 499/3895/0. Integration 36 -> 37, all PASS (test_unit_swing_root_live.gd added). project.godot byte-identical, editor never opened. Rulings 4-3c1/R1..R6 recorded: R1 the seat and its own fields; R2 IDLE=1.0; R3 the third velocity-zeroing path and its amended comment block; R4 test_unit_approach_live.gd:225's near-certain-failure prediction measured WRONG -- the reach probe is throttled to every 12 ticks (0.6 units) and steps clean over the 0.3-unit band between unit_stop_distance and minion_attack_reach_distance, geometry-dependent and not hardened; R5 test_intent_recorder.gd's intake-surface guard gains a second named exemption, EXEMPT_PURE_QUERY, for the pure-query seat, matched by name not verified purity; R6 4-3c/R12's cited coordinates confirmed stale (:776-777/:780 cited, measured at :839/:855 before this pass, :855/:884 after). Also flagged, not taken: no state-side unit test of the seat, so the 4-3c1/R2 IDLE rule is guarded only by the live integration file. 4-3d gains an additional AC 1 input from this story's live smoke: the strike/impact mismatch is now a felt symptom with a named consequence, putting the parry window in a misleading place -- the evidence AC 1's mechanism choice was waiting on, not a new defect."
  4-3d-minion-strike-alignment-and-corpse-lifecycle: "DONE 2026-08-26 -- measured strike frame T = 1.3000s, rate 1.4444, effective clip duration 1.8462s against the 1.9s cycle (the held-final-pose branch costs 0.0538s per chained swing; 4-3c's ~0.767s truncation closed as a side effect). Corpse linger: 600-tick timer owned by unit_actor, collision disabled from a seat outside _physics_process. Golden UNMOVED 4a089063. Suite 499/3895/0 unmoved, integration 37 -> 40 (test_unit_strike_alignment_live.gd, test_unit_corpse_linger_live.gd, test_unit_corpse_walkthrough_live.gd added). Live smoke PASSED on parry and windup legibility; debug pause and reset NOT judged by eye (bound keys did not fire on the operator's machine), guarded by test only. Full detail in the story file."
  4-3e-summon-spawn-placement: "DONE 2026-08-27 -- summoned units appear BEHIND the summoning hero, on the side away from the opponent, at the hero position at cast time; the frozen per-slot row (UNIT_ROW_X/SPACING/Z_START) is gone. Placement is a pure MatchRunner._compute_spawn_positions(occupied, hero, opponent, slot, batch_size); the caller builds the occupancy list (both heroes + every live unit actor, holes filtered). Outward search is rings of a REAR ARC, unbounded in candidates, terminating by finiteness -- no cap, no arena test, no fallback branch. Five readiness gates (7/3/4/4 blocking, then a deletion pass that REMOVED specification rather than adding it). Suite 499/3895/0 unmoved, golden UNMOVED 4a089063 both directions, integration 40 -> 42. FIVE integration tests were impacted, not the two the story named -- approach, strike alignment and swing root all failed on one shared cause the gates could not see: hero-relative placement puts the summoner between its own fresh unit and the enemy BY CONSTRUCTION. Code review PASS, zero blocking, one patch applied (int -> roundi on the arc step count), five deferred. LIVE SMOKE PASSED by the operator hand: five of six points judged by eye; ground contact NOT judged (camera cannot move freely), covered by the mutation-proven measured-Y test. TWO OBSERVATIONS, neither a defect of this story: the arena has NO EDGE (hero and minion both fly off past the floor; pre-existing unowned gap, candidate for its own story), and a summoner who stands still is permanently in its own minion way (goes to the playtest block, deferred to after E6)."
